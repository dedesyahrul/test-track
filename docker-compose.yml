services:
  backend:
    build:
      context: ./backend
      dockerfile: Dockerfile
    container_name: sit-backend
    restart: unless-stopped
    environment:
      DATABASE_URL: postgresql://${POSTGRES_USER:-postgres}:${POSTGRES_PASSWORD:-secret123}@${POSTGRES_HOST:-postgres_server}:5432/${POSTGRES_DB:-db_sit}
      CORS_ORIGINS: http://localhost:${FRONTEND_PORT:-3100},http://localhost:5173
    ports:
      - "${BACKEND_PORT:-8800}:8000"
    networks:
      - ai_engine_network

  frontend:
    build:
      context: ./frontend
      dockerfile: Dockerfile
    container_name: sit-frontend
    restart: unless-stopped
    ports:
      - "${FRONTEND_PORT:-3100}:80"
    depends_on:
      - backend
    networks:
      - ai_engine_network

networks:
  ai_engine_network:
    external: true
